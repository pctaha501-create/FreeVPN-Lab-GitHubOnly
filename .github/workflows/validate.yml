name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s index.html
          test -s worker/src/index.js
          test -s wrangler.jsonc
          node --check worker/src/index.js
          grep -q 'name: Deploy Cloudflare Worker' .github/workflows/deploy-worker.yml
          grep -q 'VLESS over WebSocket' worker/src/index.js
          echo 'Project validation passed.'
